<!DOCTYPE html>
<head>
    <script src="typist.js" type="module"></script>
    <link rel="stylesheet" href="typist.css">
</head>
<body>
    <div id="textStyles">
        <div class="container">
            <label for="replaceMode">Replace All?</label>
            <input type="checkbox" id="replaceMode">
        </div>
        
        <!-- <button target="eff_" style=""><span style=""></span></button> -->

        <button target="eff_red"><span style="color: red;">RED</span></button>
        <button target="eff_yellow"><span style="color: yellow; -webkit-text-stroke: black .01em; font-size: 2em;">YELLOW</span></button>
        <button target="eff_blue"><span style="color: transparent; text-transform: full-width; animation: wave 2s linear infinite;">BLUE</span></button>

        <button target="eff_shake"><span style="display: inline-block; animation: shake .2s linear infinite;">SHAKE</span></button>
        <button target="eff_drip" ><span style="animation: drip 1s ease-in infinite;">DRIP</span></button>
        <button target="eff_glow" ><span style="color: white; text-shadow: 0 0 2px orange, 0 0 10px orangered, 0 0 20px red;">GLOW</span></button>
        <button target="eff_tilt"><span style="display: inline-block; rotate: 45deg; transform: skewX(45deg);">TILT</span></button>
    </div>
    <div id="text" contenteditable="true">Start <span style="color: blue;">writing</span> here...</div>
</body>
