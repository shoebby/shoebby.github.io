<!DOCTYPE html>
<head>
    <style>
        html, body {
            padding: 0;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: black;
        }
        .page {
            width: 70vw;
            height: 39vw;

            background: url("../images/placeholder.jpg");
        }
        .obj {
            position: absolute;
            max-height: 100%;
        }
        div.obj {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;
        }
        iframe.obj {
            width: 100%;
            height: 100%;

            border: 2px solid black;
            box-sizing: border-box;

            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="page">

    </div>
</body>
