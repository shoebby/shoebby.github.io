<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="flippabook.css">
    <script src="../libraries/jquery-3.7.1.js"></script>
    <script src="../libraries/jquery-ui.js"></script>
    <script src="../libraries/FileSaver.js"></script>
    <script src="../libraries/jszip.js"></script>
    <script src="../libraries/howler.min.js"></script>
    <script src="../libraries/html2canvas.min.js"></script>
    <script src="flippabook.js" type="module"></script>
</head>
<body>
    <div id="main-grid">
        <div id="toolbar">
            <button target="skewer"><img src="./assets/skewer/skewer.png"></button>
            <button target="shuffler"><img src="./assets/shuffler/shuffler.png"></button>
            <button target="clone"><img src="./assets/cloner/cloner.png"></button>
            <button target="gun"><img src="./assets//gun/gun_inactive.png"></button>
            <button target="pump"><img src="./assets/pump/pump_inactive.png"></button>
            <button target="needle"><img src="./assets/needle/needle_inactive.png"></button>
            <button target="checker"><img src="./assets/checker/checker_inactive.png"></button>
            <button target="lock"><img src="./assets/lock/lock_inactive.png"></button>
            <button target="unlock"><img src="./assets/lock/unlocker.png"></button>
            <button target="export"><img src="../divbrush/assets/ui_saver.webp"></button>
            <button target="destroy"><img src="./assets/destroyer/destroyer_3.png"></button>
        </div>
        <div id="slides">
            <div id="slidesContainer">
                <div class="slide-thumbnail thumb1">
                    <button target="focusPage" value="1">1</button>
                    <img src="">
                </div>
            </div>
            <div class="addPage">
                <button target="addPage">ADD PAGE</button>
            </div>
        </div>
        <div id="editor">
            <div id="currentSlide">
                <div class="editslide slide1">
                    <div class="infoline">Flippabook is for making and exporting web-stories!</div>
                    <div class="infoline">Let's get started by dragging and dropping local files into the slides!</div>
                    <div class="infoline">Image, audio, video, and HTML files are all supported, so go wild!</div>
                    <div class="infoline">Press the gun tool to shoot this text away and get started!</div>
                </div>
            </div>
            <img class="explosion" src="assets/destroyer/explosion.gif">
        </div>
    </div>
</body>
</html>
