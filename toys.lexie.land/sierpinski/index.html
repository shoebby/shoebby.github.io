<!DOCTYPE html>
<HTML>
    <head>
        <title>Sierpinski Doubt!</title>
        <meta charset="UTF-8">
        <meta name="description" content="Generate tree fractals using divs style and grace">
        <meta name="author" content="shoebby">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link rel="stylesheet" href="sierpinski.css">
    </head>
    <body>
        <div style="width: 100px;">
            <label for="depth">Depth: </label>
            <input id="depth" type="text" value="8">
            <br>
            <label for="ratio">Ratio: </label>
            <input id="ratio" type="text" value="0.5">
        </div>
        <br>
        <div style="width: 100px;">
            <label for="pointAmount"># of Points: </label>
            <input type="button" value="+" id="addPoint">
            <input type="button" value="-" id="delPoint">
        </div>
        <div id="pointValues">
            <p id="pointName">Point 1</p>
            X: <input id="pointX" target="point_x_1" type="text" value="0">
            Y: <input id="pointY" target="point_y_1" type="text" value="-200">
        </div>
        <div id="pointValues">
            <p id="pointName">Point 2</p>
            X: <input id="pointX" target="point_x_2" type="text" value="200">
            Y: <input id="pointY" target="point_y_2" type="text" value="100">
        </div>
        <div id="pointValues">
            <p id="pointName">Point 3</p>
            X: <input id="pointX" target="point_x_3" type="text" value="-200">
            Y: <input id="pointY" target="point_y_3" type="text" value="100">
        </div>

        <script>
            let colorStep;
            let sizeStep;
            let rotStep = 25;
            let startSize = 10;
            let pointNum = 3;
            let depth = 8;
            let ratio = 0.5;
            const pointsArray = [];

            const pointTemplate = document.querySelector("#pointValues");

            const setDepth = document.querySelector("input[id='depth']");
            setDepth.addEventListener("input", function() {
                depth = setDepth.value;
                init(depth)
            });
            const setRatio = document.querySelector("input[id='ratio']");
            setRatio.addEventListener("input", function() {
                ratio = setRatio.value;
                init(depth)
            });

            const addPoint = document.querySelector("input[id='addPoint']");
            addPoint.addEventListener("click", (event) => {
                InitPoints(1)
            });
            const delPoint = document.querySelector("input[id='delPoint']");
            delPoint.addEventListener("click", (event) => {
                InitPoints(-1)
            });

            function init(depth) {
                destroySierpinsk();

                colorStep = 50 / depth;
                sizeStep = startSize / depth;

                const startPoint = document.createElement("div");
                startPoint.classList.add("point");
                startPoint.setAttribute("id", "point");
                document.body.appendChild(startPoint);

                startPoint.style.left = "50vw";
                startPoint.style.top = "50vh";

                setPointStyle(startPoint, depth + 1);

                InitArray();
                sierpinsk(pointsArray, depth, startPoint, ratio);

                //traditional sierpinski triangle
                //sierpinsk([[0, -200], [200, 100], [-200, 100]], depth, startPoint, .5);

                //variance
                //sierpinsk([[100, 0], [-100, 0], [0, -150], [0, 300]], depth, startPoint, .5);

                //pentagon
                //sierpinsk([[0, -150], [-125, -50], [125, -50], [75, 100], [-75, 100]],depth, startPoint, .5);
                
                //sierpinsk([[-49, -86], [-121, 145], [88, -25]],depth, startPoint, .75);
            }

            function destroySierpinsk() {
                if (document.getElementById("point") != null)
                    document.body.removeChild(document.getElementById("point"));
            }

            function sierpinsk(points, depth, parent, ratio) {
                if (depth == 0) {
                    return;
                }

                for (var i = 0; i < points.length; i++) {
                    const newPixel = document.createElement("div");
                    newPixel.classList.add("point");
                    parent.appendChild(newPixel);
                    
                    newPixel.style.transform += `translateX(${ points[i][0] }px) translateY(${ points[i][1] }px)`;

                    setPointStyle(newPixel, depth);

                    //newPixel.style.transform += `rotate(${rotStep * depth}deg)`;

                    var newPoints = points.map((point) => point.map((coord) => coord * ratio));

                    sierpinsk(newPoints, depth - 1, newPixel, ratio);
                }
            }

            function setPointStyle(point, pointDepth) {
                point.style.backgroundColor = `hsl(${(((colorStep * pointDepth) * 2) + 60)}deg, 100%, ${colorStep * pointDepth}%)`;
            }

            function InitPoints(modifier) {
                if (pointNum + modifier < 1)
                    return

                const ctrls = document.querySelectorAll("#pointValues");
                
                pointNum += modifier;

                const want = pointNum;
                const have = ctrls.length;

                if (want > have) {
                    const controller = pointTemplate.cloneNode(true);
                    document.body.appendChild(controller);
                    controller.querySelector("#pointName").innerHTML = `Point ${pointNum}`
                    controller.querySelector("#pointX").setAttribute(`target`, `point_x_${pointNum}`);
                    controller.querySelector("#pointY").setAttribute(`target`, `point_y_${pointNum}`);
                } else if (want < have) {
                    for (let i = 0; i < (have - want); i++) {
                        document.body.removeChild(ctrls[ctrls.length-1]);
                    }
                }

                let coordElements = document.querySelectorAll("#pointX, #pointY");

                coordElements.forEach(function(elem) {
                    elem.addEventListener("input", function() {
                        init(depth);
                    });
                });
            }
            InitPoints(0);

            function InitArray() {
                pointsArray.length = pointNum;

                for (let i = 0; i < pointsArray.length; i++) {
                    const newPoint = [document.querySelector(`input[target='point_x_${i+1}`).value, document.querySelector(`input[target='point_y_${i+1}`).value];
                    
                    pointsArray[i] = newPoint;
                }
            }
            init(depth)

        </script>
    <body>
